<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background e bordas</title>
    <style>
        body {
            background-image: url(https://images.unsplash.com/photo-1518770660439-4636190af475);
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <header style="color: ghostwhite; background-color: darkolivegreen; border: 4px solid yellow;">
    <h1>Minha página com CSS</h1>
    <p>Exemplo de background e bordas.</p>
    </header>

    <article style="color:black;background-color: ghostwhite; border: 3px solid black">
    <h3>Background</h3>
    <p>A propriedade background-color modifica a cor de fundo</p>
    </article>

    <article style="color:brown; background-color:lightgoldenrodyellow; border: 3px dashed rgb(255, 170, 0);">
    <h3>Borda tracejada</h3>
    <p>este elemento possui uma borda tracejada</p>
    </article>

    <article style="background-color:lightblue; border: 3px dotted blue">
    <h3>Borda pontilhada</h3>
    <p>este elemento possui uma borda pontilhada</p>
    </article>

    <article style="background-color: ghostwhite; border: 3px solid green; background-position: left bottom;">
    <h3>Imagem com borda</h3>
    <p><img src="https://images.unsplash.com/photo-1518770660439-4636190af475"></p>
    </article>

    <article style="color:ghostwhite; background-color: darkslategrey;">
    <p>aulas html-css</p>
    </article>
    </body>

</body>
</html>

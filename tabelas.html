<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela</title>
</head>
<body>
    
    <table border="3">
        <thead>
            <tr>
               <th>Nome</th>
               <th>Idade</th>
               <th>Profissão</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Ana</td>
                <td colspan="2">28</td>
                
            </tr>
            <tr>
                <td rowspan="">José</td>
                <td>23</td>
                <td>Engenheiro</td>
            </tr>
            <tr>
                <td>Antonio</td>
                <td>35</td>
                <td>Professor</td>
            </tr>

        </tbody>
    </table>

</body>
</html>
